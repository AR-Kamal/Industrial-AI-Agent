{% extends "base.html" %}

{% block title %}Log in | AI Manufacturing Support{% endblock %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 p-lg-5">
            <h1 class="h3 mb-3">Log in</h1>
            <p class="text-secondary">Use your local prototype account.</p>
            {% if form.errors %}
              <div class="alert alert-danger" role="alert">
                The username or password was not accepted.
              </div>
            {% endif %}
            <form method="post" novalidate>
              {% csrf_token %}
              <input type="hidden" name="next" value="{{ next }}">
              <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                <input
                  class="form-control"
                  id="{{ form.username.id_for_label }}"
                  name="{{ form.username.html_name }}"
                  autocomplete="username"
                  autofocus
                  required
                >
              </div>
              <div class="mb-4">
                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                <input
                  class="form-control"
                  id="{{ form.password.id_for_label }}"
                  name="{{ form.password.html_name }}"
                  type="password"
                  autocomplete="current-password"
                  required
                >
              </div>
              <button class="btn btn-primary w-100" type="submit">Log in</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
